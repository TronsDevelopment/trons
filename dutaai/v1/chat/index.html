<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DutaAI - Chat (v1.3)</title>

<!-- MathJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?version=4.8.0&features=es6"></script>

<script>
window.MathJax = {
  loader: {
    load: [
      'input/tex',
      'output/chtml',
      'ui/menu',
      '[tex]/ams',
      '[tex]/color',
      '[tex]/noerrors',
      '[tex]/noundefined'
    ]
  },
  tex: {
    inlineMath: [['\\(', '\\)'], ['$', '$']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']],
    packages: {'[+]': ['ams', 'color', 'noerrors', 'noundefined']},
    processEscapes: true,
    processRefs: true,
    processEnvironments: true,
    tags: 'ams',
    tagSide: 'right',
    tagIndent: '0.8em',
    formatError: (jax, err) => {
      console.warn('[MathJax Error]', err.message);
      return jax.formatError(err);
    }
  },
  chtml: {
    scale: 1.05,
    displayAlign: 'center',
    displayIndent: '0',
    matchFontHeight: true,
    mtextInheritFont: true,
    merrorInheritFont: true,
    unknownFamily: 'serif',
    exFactor: 0.5,
    lineBreaks: { automatic: true, width: '95% container' }
  },
  options: {
    skipHtmlTags: ['script','noscript','style','textarea','pre','code'],
    ignoreHtmlClass: 'tex2jax_ignore',
    processHtmlClass: 'tex2jax_process',
    renderActions: { addMenu: [] }
  },
  startup: {
    ready: () => {
      console.log('%c[MathJax] initialized (v3) ✨', 'color:#22d3ee');
      MathJax.startup.defaultReady();
    },
    pageReady: () => {
      console.log('%c[MathJax] ready, rendering all equations...', 'color:#22d3ee');
      return MathJax.startup.defaultPageReady();
    }
  }
};
</script>

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>

<!-- Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>

<!-- Stylesheet -->
<link rel="stylesheet" href="style.css"/>

<style>
  .deprecated-banner {
    background: linear-gradient(90deg, #ff4d4f, #ff7875);
    color: #fff;
    text-align: center;
    padding: 12px 16px;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
    position: sticky;
    top: 0;
    z-index: 999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap; /* biar teks bisa turun ke bawah pas di mobile */
    gap: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .deprecated-banner strong {
    text-decoration: underline;
  }

  .deprecated-banner a {
    background: #fff;
    color: #ff4d4f;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 8px;
    text-decoration: none;
    transition: 0.2s ease;
    white-space: nowrap; /* biar button gak pecah di tengah */
  }

  .deprecated-banner a:hover {
    background: #ffeaea;
  }

  @media (max-width: 480px) {
    .deprecated-banner {
      font-size: 13px;
      padding: 10px;
      flex-direction: column;
      gap: 8px;
    }

    .deprecated-banner a {
      width: 100%;
      text-align: center;
      padding: 8px 0;
    }
  }
</style>
</head>

<body>

  <!-- ⚠️ Banner peringatan versi kadaluwarsa -->
  <div class="deprecated-banner">
    ⚠️ Versi ini (v1.4 BETA) sudah <strong>kadaluwarsa</strong> dan tidak mendapat update dan dukungan lagi.
    <a href="https://tronsar.is-cool.dev/dutaai/v2/chat/" target="_blank" rel="noopener">Gunakan DutaAI v2 🚀</a>
  </div>

  <header>
    <div class="brand">
      <img src="DutaAI.png" alt="DutaAI Logo" class="logo">
      <div>
        <div class="title">DutaAI <span class="version">v1.4 BETA</span></div>
        <div class="meta">AI Assistant</div>
      </div>
    </div>

    <div class="header-actions">
      <div class="toggle" title="Mode Tema">
        <div class="muted">Tema</div>
        <div id="themeSwitch" class="switch" role="switch" aria-checked="false">
          <div class="knob"></div>
        </div>
      </div>
      <button id="clearBtn" class="icon-btn" title="Bersihkan chat">🧹</button>
    </div>
  </header>

<div id="loading-screen" aria-live="polite" role="status">
  <div class="terminal-boot" role="presentation" aria-hidden="false">
    <div class="boot-screen" aria-hidden="false">
      <div class="boot-window">
        <div id="bootLines" class="boot-lines" aria-hidden="false"></div>
      </div>
    </div>

    <div class="boot-right" aria-hidden="true">
      <div style="opacity:0.85; font-size:12px; color:rgba(255,255,255,0.7)">SYSTEM</div>
      <div class="duta-flash" id="dutaLabel">[ DUTA AI ]</div>
      <div class="duta-version" id="dutaLabelVersion">1.4 BETA</div>
      <div id="bootReady" class="boot-final">Ready.</div>
    </div>
  </div>
</div>

  <main>
    <div id="chat" aria-live="polite" style="display:none;"></div>
  </main>

  <div id="controls">
    <button id="attachBtn" class="icon-btn" title="Lampirkan file" aria-label="Lampirkan file">📎</button>
    <textarea id="input" placeholder="Ketik pertanyaanmu..." rows="1"></textarea>
    <button id="send" class="btn">Kirim</button>
  </div>

<script src="main.js"></script>
<script src="loader.js"></script>
</body>
</html>
